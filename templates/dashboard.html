{% extends "base.html" %}
{% block content %}

<h2>Country Sentiment Dashboard</h2>

<form method="POST">
    <select name="country" required>
        <option value="">Select Country</option>
        {% for country in countries %}
            <option value="{{ country }}">{{ country }}</option>
        {% endfor %}
    </select>
    <button type="submit">Analyze Country</button>
</form>

{% if chart_path %}
    <div class="chart">
        <img src="{{ chart_path }}" width="500">
    </div>
{% endif %}

{% endblock %}
